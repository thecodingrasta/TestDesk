name: Bug Report
description: Report a defect or unexpected behavior in TestDesk.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure you are running the latest release of TestDesk.
  - type: input
    id: version
    attributes:
      label: TestDesk Version
      description: What version or commit of TestDesk are you using?
      placeholder: e.g. 1.0.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 / 10 (x64)
        - Windows 11 (ARM64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu / Debian)
        - Linux (Fedora / RHEL / Arch)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps explaining how to trigger the issue.
      placeholder: |
        1. Open TestDesk with project ...
        2. Run test ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Diagnostics
      description: Relevant output from TestDesk or terminal logs (found in `.testdesk/runs/`).
      render: shell
