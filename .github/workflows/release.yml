name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing reviewed version tag that matches VERSION, such as v1.0.0 or v1.0.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the reviewed tag to identify this exact source
        env:
          VERSION_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse --verify --end-of-options "refs/tags/$VERSION_TAG^{commit}")" = "$GITHUB_SHA"
          test "$VERSION_TAG" = "v$(tr -d '\r\n' < VERSION)"

  validate:
    needs: verify
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
          - os: ubuntu-24.04
            target: linux-amd64
          - os: macos-15-intel
            target: macos-amd64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/install_linux_deps.sh
      - name: Build and archive the native package
        run: python scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke (${{ matrix.target }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
          - os: ubuntu-24.04
            target: linux-amd64
          - os: macos-15-intel
            target: macos-amd64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist
      - name: Install Linux runtime libraries only
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/install_linux_deps.sh --runtime
      - name: Ensure Windows WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/Ensure-WebView2.ps1
      - name: Verify and exercise the downloaded package
        if: runner.os != 'Linux'
        run: python scripts/check_package.py --desktop-smoke
      - name: Verify the downloaded Linux package
        if: runner.os == 'Linux'
        run: python scripts/check_package.py

  draft:
    needs: [package, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Add matching source and combined checksums
        env:
          VERSION_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c -- *.sha256
          rm -- *.sha256
          git -C .. archive --format=tar.gz --prefix="TestDesk-$VERSION_TAG/" --output="dist/TestDesk-$VERSION_TAG-source.tar.gz" "$GITHUB_SHA"
          # Written outside dist first so the checksum file cannot list itself.
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -l
      - name: Create a draft, never publish automatically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --draft --generate-notes)
          if [[ "$VERSION_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$VERSION_TAG" dist/* "${flags[@]}"
